<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0E1014" />
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Fury Book</title>
  <style>
    html, body, #furybook-app { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0E1014; }
    body { overscroll-behavior:none; }
  </style>
</head>
<body>
  <div id="furybook-app"></div>
  <script data-auth-entry>
    // Handle recovery before Supabase's normal bootstrap can consume the token and sync characters.
    const authParams = new URLSearchParams(window.location.hash.slice(1));
    if (authParams.get('type') === 'recovery' || authParams.has('error') || authParams.has('error_code')) {
      window.location.replace('../reset-password.html' + window.location.hash);
    } else {
      const appScript = document.createElement('script');
      appScript.src = 'fury-book.js';
      document.body.appendChild(appScript);
    }
  </script>
</body>
</html>
