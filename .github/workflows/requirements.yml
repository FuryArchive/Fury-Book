name: Rules requirements

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: requirements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Kotlin compiler
        run: kotlinc -version
      - name: Audit bundled requirement coverage
        run: python3 tools/tests/test_automatic_requirements.py --audit
      - name: Run requirement and planner regressions
        run: python3 tools/tests/test_automatic_requirements.py
