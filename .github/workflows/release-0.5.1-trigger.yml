name: Force-clear failed 0.5.1 release run

on:
  push:
    branches: [release/0.5.1-trigger]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded release run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/actions/runs/36594809124/force-cancel" || true
