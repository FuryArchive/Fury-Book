name: Dispatch Fury Book 0.5.1 release

on:
  push:
    branches: [release/0.5.1-trigger]

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Move v0.5.1 to current main and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/v0.5.1"             -f sha="$MAIN_SHA"             -F force=true
          gh workflow run release.yml             --repo "$GH_REPO"             --ref main             -f version=0.5.1
          echo "v0.5.1 -> $MAIN_SHA; release workflow dispatched"
