name: Android CI

on:
  push:
    branches: [main, codex/furybook-rules-completion-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquisition-import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install pytest

      - name: Test source import and native rule bindings
        run: |
          python -m pytest -q --junitxml=out/acquisition-import-regression.xml \
            tools/tests/test_rulebook_acquisition_import.py \
            tools/tests/test_native_*.py

      - name: Upload importer regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-Acquisition-Import-Regression
          path: out/acquisition-import-regression.xml
          if-no-files-found: warn
          retention-days: 14

  acquisition-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run shared regression including acquisition and durable recovery
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --configuration-cache \
            --init-script tools/ci/standard-regression.init.gradle \
            :shared:desktopTest --stacktrace

      - name: Upload acquisition regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-Acquisition-Regression
          path: |
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
          if-no-files-found: warn
          retention-days: 14

  build:
    needs: [acquisition-import-regression, acquisition-regression]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test and build development APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --configuration-cache \
            --init-script tools/ci/standard-regression.init.gradle \
            :app:testDebugUnitTest :app:assemblePreview

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/preview/app-preview.apk out/Fury-Book-Android.apk

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-Android
          path: out/Fury-Book-Android.apk
          if-no-files-found: error
          retention-days: 14

  web-distribution:
    needs: [acquisition-import-regression, acquisition-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build web distribution
        env:
          NPM_CONFIG_ALLOW_GIT: all
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --configuration-cache :webApp:compileKotlinJs :webApp:jsBrowserDistribution --stacktrace

      - name: Set up Firefox for legacy character compatibility
        id: legacy-firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest-esr

      - name: Reopen legacy browser extras without losing unknown fields
        env:
          FIREFOX_BIN: ${{ steps.legacy-firefox.outputs.firefox-path }}
          NPM_CONFIG_ALLOW_GIT: all
        run: |
          export FURYBOOK_FIREFOX_LAUNCH_SCRIPT="$GITHUB_WORKSPACE/tools/tests/launch_browser_acquisition_firefox.sh"
          export FURYBOOK_FIREFOX_PROFILE="$RUNNER_TEMP/fury-legacy-firefox-profile"
          mkdir -p "$FURYBOOK_FIREFOX_PROFILE"
          chmod +x "$FURYBOOK_FIREFOX_LAUNCH_SCRIPT"
          ./gradlew --no-daemon :webApp:jsBrowserTest --tests '*BrowserLegacyExtrasCompatibilityTest' --stacktrace

      - name: Package web distribution
        run: |
          test -f webApp/build/dist/js/productionExecutable/index.html
          mkdir -p out
          cd webApp/build/dist/js/productionExecutable
          zip -q -r "$GITHUB_WORKSPACE/out/Fury-Book-Web.zip" .

      - name: Upload web distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-Web
          path: out/Fury-Book-Web.zip
          if-no-files-found: error
          retention-days: 14
