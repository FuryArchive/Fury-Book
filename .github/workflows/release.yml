name: Fury Book Release

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.5.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fury-book-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      native_version: ${{ steps.meta.outputs.native_version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Resolve release version
        id: meta
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${RELEASE_VERSION_INPUT}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tag must look like v0.5 or v0.5.1" >&2
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            NATIVE_VERSION="${VERSION}.0"
          else
            NATIVE_VERSION="$VERSION"
          fi

          # Fury Book uses a high range so 0.5 can still upgrade older Android
          # builds whose legacy DUBL versionCode reached 6002000.
          VERSION_CODE=$((100000000 + 10#$MAJOR * 100000000 + 10#$MINOR * 1000000 + 10#$PATCH * 1000))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "native_version=$NATIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  content-pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.validate.outputs.version }}

      - name: Install FCP validation dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pytest

      - name: Validate DUBL FCP contract
        run: python3 -m pytest -q tools/tests/test_fcp_contract.py

      - name: Build DUBL FCP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 -m tools.fcp.build_fcp \
            --source shared/src/commonMain/resources/fcp/dubl-3.69 \
            --output "out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-3.69.fcp"
          python3 -m tools.fcp.build_fcp \
            --source shared/src/commonMain/resources/fcp/dubl-chi-3.69 \
            --output "out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-Chi-3.69.fcp"

      - name: Upload DUBL FCP release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fury-book-release-fcp
          path: |
            out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-3.69.fcp
            out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-3.69.fcp.sha256
            out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-Chi-3.69.fcp
            out/Fury-Book-${{ needs.validate.outputs.version }}-DUBL-Chi-3.69.fcp.sha256
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FURY_BOOK_VERSION_NAME: ${{ needs.validate.outputs.version }}
      FURY_BOOK_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.validate.outputs.version }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/fury-book-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "FURY_BOOK_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "FURY_BOOK_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FURY_BOOK_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FURY_BOOK_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build signed Android APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify and stage Android APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          [[ -f "$APK" ]] || { echo "Signed release APK not found" >&2; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p out
          cp "$APK" "out/Fury-Book-${{ needs.validate.outputs.version }}-Android.apk"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: fury-book-release-android
          path: out/Fury-Book-${{ needs.validate.outputs.version }}-Android.apk
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-latest
    env:
      FURY_BOOK_VERSION: ${{ needs.validate.outputs.native_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.validate.outputs.version }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3-pytest python3-docx xvfb

      - name: Run release contracts
        run: |
          pytest -q \
            tools/tests/test_unified_release_workflow.py \
            tools/tests/test_fury_branding.py \
            tools/tests/test_build_version_matrix.py \
            tools/tests/test_compose_release_ready.py \
            tools/tests/test_rulebook_release_gate.py

      - name: Compile and test shared desktop runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :shared:desktopTest :desktopApp:compileKotlin --stacktrace

      - name: Build and stage Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/linux/build-appimage.sh
          packaging/linux/build-appimage.sh
          SOURCE="dist/Fury-Book-${FURY_BOOK_VERSION}-linux-x86_64.AppImage"
          [[ -x "$SOURCE" ]] || { echo "Missing AppImage: $SOURCE" >&2; exit 1; }
          mkdir -p out
          TARGET="out/Fury-Book-${{ needs.validate.outputs.version }}-Linux-x86_64.AppImage"
          mv "$SOURCE" "$TARGET"
          sha256sum "$TARGET" > "$TARGET.sha256"

      - name: Verify Linux bundled runtime modules
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_FILE="desktopApp/build/compose/binaries/main/app/FuryBook/lib/runtime/release"
          [[ -f "$RELEASE_FILE" ]] || { echo "Missing bundled runtime metadata: $RELEASE_FILE" >&2; exit 1; }
          grep -Eq 'MODULES=.*(^| )java\.net\.http( |$)' "$RELEASE_FILE" || {
            echo "Bundled Desktop runtime is missing java.net.http" >&2
            cat "$RELEASE_FILE" >&2
            exit 1
          }

      - name: Smoke-test Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="out/Fury-Book-${{ needs.validate.outputs.version }}-Linux-x86_64.AppImage"
          SMOKE_HOME="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_HOME"' EXIT
          set +e
          HOME="$SMOKE_HOME" APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a "$APPIMAGE" >"$RUNNER_TEMP/fury-book-compose-smoke.out" 2>"$RUNNER_TEMP/fury-book-compose-smoke.err"
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 124 ]]; then
            echo "Fury Book AppImage exited during smoke test with status $STATUS" >&2
            cat "$RUNNER_TEMP/fury-book-compose-smoke.out" || true
            cat "$RUNNER_TEMP/fury-book-compose-smoke.err" || true
            exit 1
          fi

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fury-book-release-linux
          path: |
            out/Fury-Book-${{ needs.validate.outputs.version }}-Linux-x86_64.AppImage
            out/Fury-Book-${{ needs.validate.outputs.version }}-Linux-x86_64.AppImage.sha256
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    env:
      FURY_BOOK_VERSION: ${{ needs.validate.outputs.native_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.validate.outputs.version }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Test, compile, and package Windows desktop
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon :shared:desktopTest :desktopApp:compileKotlin :desktopApp:createDistributable :desktopApp:packageExe :desktopApp:packageMsi --stacktrace

      - name: Verify Windows bundled runtime modules
        shell: pwsh
        run: |
          $releaseFile = 'desktopApp/build/compose/binaries/main/app/FuryBook/lib/runtime/release'
          if (-not (Test-Path $releaseFile)) { throw "Missing bundled runtime metadata: $releaseFile" }
          $runtime = Get-Content $releaseFile -Raw
          if ($runtime -notmatch '(^| )java\.net\.http( |$)') {
            Write-Host $runtime
            throw 'Bundled Desktop runtime is missing java.net.http'
          }

      - name: Stage Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem 'desktopApp/build/compose/binaries/main/exe/*.exe' -ErrorAction Stop | Select-Object -First 1
          $msi = Get-ChildItem 'desktopApp/build/compose/binaries/main/msi/*.msi' -ErrorAction Stop | Select-Object -First 1
          if (-not $exe) { throw 'Windows EXE package was not produced.' }
          if (-not $msi) { throw 'Windows MSI package was not produced.' }
          Copy-Item $exe.FullName 'out/Fury-Book-${{ needs.validate.outputs.version }}-Windows-x64.exe'
          Copy-Item $msi.FullName 'out/Fury-Book-${{ needs.validate.outputs.version }}-Windows-x64.msi'

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fury-book-release-windows
          path: |
            out/Fury-Book-${{ needs.validate.outputs.version }}-Windows-x64.exe
            out/Fury-Book-${{ needs.validate.outputs.version }}-Windows-x64.msi
          if-no-files-found: error

  publish:
    needs: [validate, content-pack, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fury-book-release-*
          path: release
          merge-multiple: true

      - name: Publish one GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          shopt -s nullglob
          FILES=(release/*)
          [[ ${#FILES[@]} -ge 7 ]] || { echo "Expected release artifacts are missing" >&2; ls -la release || true; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --verify-tag \
              --title "Fury Book $VERSION" \
              --generate-notes
          fi
