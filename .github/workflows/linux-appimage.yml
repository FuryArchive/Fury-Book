name: Linux Desktop Compose

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version (for example 0.5.0)
        required: false
        default: 0.5.0
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl unzip python3-pytest python3-docx xvfb

      - name: Run Desktop 0.2 parity release gate
        run: |
          pytest -q \
            tools/tests/test_desktop_02_parity.py \
            tools/tests/test_desktop_02_catalogs.py \
            tools/tests/test_desktop_02_persistence.py \
            tools/tests/test_desktop_02_workflows.py \
            tools/tests/test_desktop_02_sheet_parity.py \
            tools/tests/test_desktop_02_detail_parity.py \
            tools/tests/test_desktop_02_development_grouping.py \
            tools/tests/test_compose_desktop_parity.py \
            tools/tests/test_compose_sheet_remaining_parity.py \
            tools/tests/test_compose_interaction_parity.py \
            tools/tests/test_compose_collection_parity.py \
            tools/tests/test_compose_destructive_and_validation_parity.py \
            tools/tests/test_compose_development_purchase_parity.py \
            tools/tests/test_compose_development_chi_parity.py \
            tools/tests/test_compose_development_chi_backend_parity.py \
            tools/tests/test_compose_magic_parity.py \
            tools/tests/test_magic_backend_parity.py \
            tools/tests/test_equipment_backend_parity.py \
            tools/tests/test_ruleset_parity_contract.py \
            tools/tests/test_rules_boundary_contract.py \
            tools/tests/test_rulebook_core_skills_rolls_contract.py \
            tools/tests/test_desktop_persistence.py \
            tools/tests/test_compose_state_observation.py \
            tools/tests/test_compose_android_062_sheet_roll_parity.py \
            tools/tests/test_desktop_ui_structural_redesign.py \
            tools/tests/test_shared_application_lock.py \
            tools/tests/test_shared_application_golden.py \
            tools/tests/test_character_transfer.py \
            tools/tests/test_rulebook_raw_ir.py \
            tools/tests/test_rulebook_source_index.py \
            tools/tests/test_rulebook_diagnostics.py \
            tools/tests/test_rulebook_source_diagnostics.py \
            tools/tests/test_rulebook_ruleset_build.py \
            tools/tests/test_rulebook_validator.py \
            tools/tests/test_rulebook_baseline.py \
            tools/tests/test_rulebook_baseline_cli.py \
            tools/tests/test_rulebook_conditions_import.py \
            tools/tests/test_rulebook_conditions_runtime_parity.py \
            tools/tests/test_rulebook_skills_import.py \
            tools/tests/test_rulebook_skill_kotlin_renderer.py \
            tools/tests/test_rulebook_skills_runtime_parity.py \
            tools/tests/test_rulebook_development_import.py \
            tools/tests/test_rulebook_ability_roots_import.py \
            tools/tests/test_rulebook_martial_arts_import.py \
            tools/tests/test_rulebook_chi_import.py \
            tools/tests/test_rulebook_magic_import.py \
            tools/tests/test_rulebook_equipment_import.py \
            tools/tests/test_rulebook_skill_effects_import.py \
            tools/tests/test_rulebook_skill_effects_runtime_promotion.py \
            tools/tests/test_rulebook_source_of_truth_contract.py \
            tools/tests/test_skill_effect_stable_id.py \
            tools/tests/test_skill_effect_disable_escape_hatch.py \
            tools/tests/test_rulebook_magic_equipment_runtime_promotion.py \
            tools/tests/test_magic_unresolved_escape_hatch.py \
            tools/tests/test_development_rulebook_unresolved_runtime.py \
            tools/tests/test_skill_untrained_contract.py \
            tools/tests/test_skill_local_override_contract.py \
            tools/tests/test_skill_override_persistence.py \
            tools/tests/test_skill_local_override_ui.py \
            tools/tests/test_condition_local_override_contract.py \
            tools/tests/test_condition_override_persistence.py \
            tools/tests/test_condition_local_override_ui.py \
            tools/tests/test_development_unresolved_escape_hatch.py \
            tools/tests/test_development_local_override_contract.py \
            tools/tests/test_development_override_persistence.py \
            tools/tests/test_development_override_session.py \
            tools/tests/test_development_override_ui.py \
            tools/tests/test_rulebook_development_runtime_promotion.py \
            tools/tests/test_rulebook_release_gate.py \
            tools/tests/test_build_version_matrix.py \
            tools/tests/test_fcp_contract.py \
            tools/tests/test_namespace_ownership.py \
            tools/tests/test_windows_desktop_ci.py \
            tools/tests/test_compose_release_ready.py

      - name: Build DUBL Fury Content Pack
        run: |
          python3 -m tools.fcp.build_fcp \
            --source shared/src/commonMain/resources/fcp/dubl-3.69 \
            --output dist/fcp/dubl-3.69.fcp
          python3 -m tools.fcp.build_fcp \
            --source shared/src/commonMain/resources/fcp/dubl-chi-3.69 \
            --output dist/fcp/dubl-chi-3.69.fcp

      - name: Upload DUBL FCP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-DUBL-3.69-FCP
          path: |
            dist/fcp/dubl-3.69.fcp
            dist/fcp/dubl-3.69.fcp.sha256
            dist/fcp/dubl-chi-3.69.fcp
            dist/fcp/dubl-chi-3.69.fcp.sha256
          if-no-files-found: error

      - name: Compile and test Compose Desktop
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest :desktopApp:compileKotlin --stacktrace

      - name: Resolve desktop version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION:-0.5.0}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid desktop version: $VERSION" >&2; exit 1; }
          echo "FURY_BOOK_DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Compose Desktop AppImage
        run: |
          chmod +x gradlew packaging/linux/build-appimage.sh
          FURY_BOOK_VERSION="$FURY_BOOK_DESKTOP_VERSION" packaging/linux/build-appimage.sh

      - name: Verify bundled Desktop runtime modules
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_FILE="desktopApp/build/compose/binaries/main/app/FuryBook/lib/runtime/release"
          [[ -f "$RELEASE_FILE" ]] || { echo "Missing bundled runtime metadata: $RELEASE_FILE" >&2; exit 1; }
          grep -Eq 'MODULES=.*(^| )java\.net\.http( |$)' "$RELEASE_FILE" || {
            echo "Bundled Desktop runtime is missing java.net.http" >&2
            cat "$RELEASE_FILE" >&2
            exit 1
          }

      - name: Smoke-test Compose AppImage
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="dist/Fury-Book-${FURY_BOOK_DESKTOP_VERSION}-linux-x86_64.AppImage"
          [[ -x "$APPIMAGE" ]] || { echo "Missing executable AppImage: $APPIMAGE" >&2; exit 1; }
          SMOKE_HOME="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_HOME"' EXIT
          set +e
          HOME="$SMOKE_HOME" APPIMAGE_EXTRACT_AND_RUN=1 timeout 8s xvfb-run -a "$APPIMAGE" >"$RUNNER_TEMP/fury-book-compose-smoke.out" 2>"$RUNNER_TEMP/fury-book-compose-smoke.err"
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 124 ]]; then
            echo "Compose AppImage exited during smoke test with status $STATUS" >&2
            cat "$RUNNER_TEMP/fury-book-compose-smoke.out" || true
            cat "$RUNNER_TEMP/fury-book-compose-smoke.err" || true
            exit 1
          fi

      - name: Upload Linux desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Book-Linux-Desktop
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error
