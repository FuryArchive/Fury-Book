<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://xmmekahkeervdvrywmys.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#0E1014">
  <title>Восстановление пароля — Fury Book</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #EEE9E1; background: #0E1014; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(100%, 450px); padding: 28px; background: #191C23; border: 1px solid #30343E; border-radius: 20px; }
    .brand { margin: 0 0 24px; color: #D0AE7E; font-weight: 750; font-size: 22px; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.2; }
    p { line-height: 1.5; overflow-wrap: anywhere; }
    #description, .hint { color: #A1A5B0; }
    fieldset { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
    label { display: block; margin: 16px 0 7px; }
    input { width: 100%; min-height: 46px; border: 1px solid #555A68; border-radius: 8px; background: #0E1014; color: #EEE9E1; padding: 10px 12px; font: inherit; }
    button { width: 100%; min-height: 46px; margin-top: 22px; padding: 11px 14px; border: 0; border-radius: 10px; background: #A83948; color: #FFF; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover:not(:disabled) { background: #BB5863; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #D0AE7E; outline-offset: 3px; }
    .hint { font-size: 13px; margin: 7px 0 0; }
    .message { font-size: 14px; color: #C7D9CA; margin: 18px 0; }
    .message:empty { display: none; }
    .error { color: #FFB4AB; }
    a { display: inline-block; margin-top: 22px; color: #D0AE7E; text-underline-offset: 4px; }
    [hidden] { display: none !important; }
    @media (max-width: 400px) { main { padding: 22px; } h1 { font-size: 23px; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">Fury Book</p>
    <h1 id="heading">Восстановление пароля</h1>
    <p id="description">Введите почту, указанную при регистрации в Fury Book.</p>
    <form id="request-form" novalidate hidden>
      <fieldset id="request-fields">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
        <button id="send-button" type="submit">Отправить ссылку</button>
      </fieldset>
    </form>
    <form id="reset-form" novalidate hidden>
      <fieldset id="reset-fields">
        <label for="password">Новый пароль</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="password-hint" required>
        <p class="hint" id="password-hint">Минимум 8 символов.</p>
        <label for="confirmation">Повторите пароль</label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" required>
        <button id="save-button" type="submit">Сохранить пароль</button>
      </fieldset>
    </form>
    <p id="status" class="message" role="status" aria-live="polite"></p>
    <button id="retry-button" type="button" hidden>Повторить проверку ссылки</button>
    <a id="back-link" href="./app/">Назад ко входу</a>
    <noscript><p>Для восстановления пароля включите JavaScript в браузере.</p></noscript>
  </main>
  <script type="module" src="./password-recovery.mjs"></script>
</body>
</html>
